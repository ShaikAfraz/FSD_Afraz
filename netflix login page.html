<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <nav>
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" class="logo" alt="Netflix">
            
            <div class="nav-right">
                <div class="lang-container">
                    <select class="language-dropdown">
                        <option value="en">English</option>
                        <option value="hi">हिन्दी</option>
                    </select>
                </div>
                <button class="signin-btn">Sign In</button>
            </div>
        </nav>

        <div class="hero-content">
            <h1>Unlimited movies, shows, and more</h1>
            <p>Starts at ₹149. Cancel at any time.</p>
            <p class="subtitle">Ready to watch? Enter your email to create or restart your membership.</p>
            
            <div class="email-signup">
                <input type="email" placeholder="Email address">
                <button class="get-started-btn">Get Started &gt;</button>
            </div>
        </div>
    </header>

    <section class="trending">
        <h2>Trending Now</h2>
        <div class="movie-grid">
            <div class="card"><span class="rank">1</span><img src="https://via.placeholder.com/180x250/111/fff?text=Stranger+Things" alt="Movie"></div>
            <div class="card"><span class="rank">2</span><img src="https://via.placeholder.com/180x250/111/fff?text=Taskaree" alt="Movie"></div>
            <div class="card"><span class="rank">3</span><img src="https://via.placeholder.com/180x250/111/fff?text=Ishq+Mein" alt="Movie"></div>
            <div class="card"><span class="rank">4</span><img src="https://via.placeholder.com/180x250/111/fff?text=Kapil+Sharma" alt="Movie"></div>
            <div class="card"><span class="rank">5</span><img src="https://via.placeholder.com/180x250/111/fff?text=Akha" alt="Movie"></div>
        </div>
    </section>

</body>
</html>
