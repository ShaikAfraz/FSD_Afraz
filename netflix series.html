<html>
<head>
    <title>Netflix</title>

    <style>
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
                url("./bg.jpe.jpeg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
        }

        /* Navbar */
        .navbar{
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            background-color: rgba(0,0,0,0.85);
        }

        .logo{
            color: #e50914;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .search-box input{
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 4px;
            border: none;
            outline: none;
            width: 200px;
        }

        /* Container */
        .container{
            padding: 40px;
        }

        h2{
            margin-bottom: 20px;
        }

        /* Series Row */
        .row{
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card{
            width: 220px;
            background-color: #181818;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .card:hover{
            transform: scale(1.08);
        }

        .card img{
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .card-content{
            padding: 12px;
        }

        .card-content h3{
            font-size: 16px;
            margin-bottom: 10px;
        }

        .card-content button{
            background-color: #e50914;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
        }

        .card-content button:hover{
            background-color: #f40612;
        }

        /* Footer */
        .footer{
            text-align: center;
            padding: 30px;
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">NETFLIX</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search series..." onkeyup="searchSeries()">
        </div>
    </div>

    <!-- Content -->
    <div class="container">
        <h2>Popular on Netflix</h2>

        <div class="row" id="seriesList">

            <div class="card" data-title="stranger things">
                <img src="./stranger-things-768x1024-23262">
                <div class="card-content">
                    <h3>Stranger Things</h3>
                    <button>Watch Now</button>
                </div>
            </div>

            <div class="card" data-title="money heist">
                <img src="./money-heist.jpe.jpeg">
                <div class="card-content">
                    <h3>Money Heist</h3>
                    <button>Watch Now</button>
                </div>
            </div>

            <div class="card" data-title="breaking bad">
                <img src="./bb.jpe.jpeg">
                <div class="card-content">
                    <h3>Breaking Bad</h3>
                    <button>Watch Now</button>
                </div>
            </div>

            <div class="card" data-title="dark">
                <img src="./dark.jpe.jpeg">
                <div class="card-content">
                    <h3>Dark</h3>
                    <button>Watch Now</button>
                </div>
            </div>

            <div class="card" data-title="the witcher">
                <img src="./the witcher.jpe.jpeg">
                <div class="card-content">
                    <h3>The Witcher</h3>
                    <button>Watch Now</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        © 2026 Netflix Clone | Educational Project
    </div>

    <!-- JavaScript -->
    <script>
        function searchSeries(){
            let input = document.getElementById("searchInput").value.toLowerCase();
            let cards = document.getElementsByClassName("card");

            for(let i = 0; i < cards.length; i++){
                let title = cards[i].getAttribute("data-title");

                if(title.includes(input)){
                    cards[i].style.display = "block";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
