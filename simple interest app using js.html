<html>
    <head>
        <title>Simple Interest App</title>
    </head>
    <body>
        <h1>Simple Interest App</h1>
        <script>
            let p_amount = Number(prompt("Enter principle amount:"));
            let time = Number(prompt("Enter time in months:"));
            let rate = Number(prompt("Enter rate of interest:"));
            let s_interest = p_amount * time * rate /100;
            document.write("Principle amount is : "+p_amount+"<br>");
            document.write("Time is : "+time+"<br>");
            document.write("Rate is : "+rate+"<br>");
            document.write("Simple Interest is : "+s_interest+"<br>");
        </script>
    </body>
</html>
