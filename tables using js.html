<html>
    <head>
        <title>Tables</title>
    </head>
    <body>
        <h1>Math Tables</h1>
        <script>
            for(let a = 1; a<=10;a++){
                document.write(`5 * ${a} = ${5*a}<br>`);
            }
            let b = 1;
            while(b <= 10){
                document.write(`10 * ${b} = ${10*b}<br>`);
                b++
            }
            let i=1;
            do{
                document.write(`20* ${i} = ${20*i}<br>`)
                i++
            }while(i <= 10)
        </script>
    </body>
</html>
